# Kernel-mode driver build for x64, x86 and ARM64.
#
# Two things here are deliberate and worth not "tidying up":
#
# 1. The DMF patch is applied with --reject and its exit code is ignored. Four
#    hunks always reject, all of them in DMF's user-mode projects (DmfU*). Every
#    kernel-mode project applies cleanly, and those are the only ones this driver
#    needs. Upstream's AppVeyor script got away with this silently because cmd
#    did not propagate the exit code; pwsh does, which is why it must be handled
#    explicitly rather than left to chance. The step still asserts that DmfK
#    actually got patched, so a genuinely broken patch fails loudly.
#
# 2. Only the DmfK target is built, not all of Dmf.sln. The driver links
#    DmfK.lib and nothing else from DMF, and the user-mode projects are the ones
#    the patch cannot fix — building them would fail for no useful reason.
#
# The WDK version is detected at runtime rather than pinned, so this does not
# break when the runner image changes what it ships.

name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  DMF_REF: 31558c2

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, x86, ARM64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install WDK
        run: |
          choco install windowsdriverkit11 -y --no-progress
        shell: pwsh

      - name: Detect WDK version
        # Pick the newest installed kit that actually has kernel-mode libraries;
        # an SDK without them cannot build a driver. Exported for later steps.
        #
        # Two filters matter here, and dropping either one reintroduces a bug:
        #
        #   - Only 10.0.x.y directories are candidates. Windows Kits\10\Lib also
        #     holds the legacy kits win7, win8 and winv6.3, and all three carry
        #     km\x64 -- so "has kernel-mode libs" alone does not identify a
        #     Windows 10 WDK.
        #   - The sort is by [version], not by name. A descending *string* sort
        #     ranks "winv6.3" above "10.0.19041.0" (w > 1), which is how this
        #     step came to export winv6.3, the Windows 8.1 moniker, as the WDK
        #     version and force it onto msbuild as a global property.
        run: |
          $root = "C:\Program Files (x86)\Windows Kits\10"
          $kits = Get-ChildItem "$root\Lib" -Directory -ErrorAction SilentlyContinue |
                    Where-Object { $_.Name -match '^10\.\d+\.\d+\.\d+$' -and
                                   (Test-Path "$($_.FullName)\km\x64") } |
                    Sort-Object { [version]$_.Name } -Descending
          if (-not $kits) { throw "no Windows 10 WDK with kernel-mode libraries found under $root\Lib" }
          $v = $kits[0].Name
          Write-Host "Kits with kernel-mode libs: $($kits.Name -join ', ')"
          Get-ChildItem "$root\Lib\$v\km" -Directory | ForEach-Object { "  km lib arch: $($_.Name)" }
          if ([string]::IsNullOrWhiteSpace($v)) {
            Write-Host "::error::WDK version detection produced an empty value"
            exit 1
          }
          # Surfaced as an annotation because annotations are readable from the
          # API without a token, unlike job logs.
          Write-Host "::notice::Detected WDK version $v"
          "WDK_VERSION=$v" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          exit 0
        shell: pwsh

      - name: Clone and patch DMF
        # Two properties of GitHub's pwsh shell fight this step, and both have to
        # be handled explicitly:
        #
        #   - it sets $ErrorActionPreference = 'Stop', which turns git's ordinary
        #     stderr progress output into a terminating error;
        #   - it appends "exit $LASTEXITCODE" to the script, so a non-zero code
        #     left behind by ANY earlier command fails the step, even if later
        #     commands succeeded.
        #
        # git apply --reject legitimately exits non-zero here: four hunks always
        # reject, all in DMF's user-mode DmfU* projects. So the exit code is
        # captured and reported rather than inherited, and the step ends with an
        # explicit exit 0 after asserting the patch landed where it matters.
        run: |
          $ErrorActionPreference = 'Continue'

          git clone --quiet https://github.com/microsoft/DMF.git "$env:RUNNER_TEMP\DMF" 2>&1 | ForEach-Object { "$_" }
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::DMF clone failed ($LASTEXITCODE)"; exit 1 }

          Set-Location "$env:RUNNER_TEMP\DMF"

          git checkout --quiet $env:DMF_REF 2>&1 | ForEach-Object { "$_" }
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::checkout of $env:DMF_REF failed ($LASTEXITCODE)"; exit 1 }

          git apply --reject "$env:GITHUB_WORKSPACE\patches\dmf.diff" 2>&1 | ForEach-Object { "$_" }
          Write-Host "git apply exited $LASTEXITCODE (non-zero is expected: DmfU* hunks reject)"

          $dmfk = Get-Content "Dmf\Solution\DmfK\DmfK.vcxproj" -Raw
          if ($dmfk -match 'LatestTargetPlatformVersion') {
            Write-Host "::error::DmfK.vcxproj still references LatestTargetPlatformVersion - the patch did not apply where it matters"
            exit 1
          }
          Write-Host "DmfK.vcxproj patched as expected"
          exit 0
        shell: pwsh

      - name: Map platform name for DMF
        # DMF calls the 32-bit platform Win32; this solution calls it x86.
        id: plat
        run: |
          $dmf = if ("${{ matrix.platform }}" -eq "x86") { "Win32" } else { "${{ matrix.platform }}" }
          "dmf_platform=$dmf" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Report driver toolset availability
        # Diagnostic only, never fails the job. The kernel-mode toolset comes from
        # the WDK's Visual Studio integration, which is installed separately from
        # the WDK itself -- when it is missing, msbuild reports MSB8020 and that
        # reads like a missing SDK rather than missing VS integration.
        run: |
          $ErrorActionPreference = 'Continue'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -products * -property installationPath | ForEach-Object {
              Write-Host "VS instance: $_"
              $tsDir = "$_\MSBuild\Microsoft\VC"
              Get-ChildItem $tsDir -Directory -ErrorAction SilentlyContinue |
                ForEach-Object { Write-Host "  VC targets: $($_.Name)" }
              Get-ChildItem "$_\MSBuild\Microsoft\WindowsDriver" -Directory -ErrorAction SilentlyContinue |
                ForEach-Object { Write-Host "  WindowsDriver targets: $($_.Name)" }
            }
          }
          $vsix = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Vsix" -Recurse -Filter *.vsix -ErrorAction SilentlyContinue
          Write-Host "WDK VSIX packages found: $($vsix.Count)"
          $vsix | ForEach-Object { Write-Host "  $($_.FullName)" }
          exit 0
        shell: pwsh

      - name: Build DMF (DmfK only)
        # Only DmfK: the driver links DmfK.lib and nothing else from DMF, and the
        # user-mode projects are exactly the ones the patch cannot fix. Release
        # only -- DMF produces no Debug output, so a Debug driver build would fail
        # at link with a missing DmfK.lib.
        #
        # msbuild output is captured and its errors re-emitted as ::error::
        # annotations, because annotations are readable from the API without
        # authentication while raw job logs are not. Without this, a failure here
        # surfaces only as "Process completed with exit code 1".
        run: |
          $ErrorActionPreference = 'Continue'
          # Never pass this property empty. It is a GLOBAL msbuild property, so an
          # empty value cannot be corrected by the WDK's own fallback in
          # WindowsDriver.Default.props, which then treats the target platform as
          # unknown, drops to the legacy branch and yields TargetPlatformVersion
          # "winv6.3" -- Windows 8.1. That surfaces far away as MSB4086, "a numeric
          # comparison was attempted on ... winv6.3", from the common C++ targets.
          $args = @("$env:RUNNER_TEMP\DMF\Dmf.sln", "/t:DmfK",
                    "/p:Configuration=Release",
                    "/p:Platform=${{ steps.plat.outputs.dmf_platform }}",
                    "/m", "/v:minimal", "/nologo")
          if (-not [string]::IsNullOrWhiteSpace($env:WDK_VERSION)) {
            $args += "/p:WindowsTargetPlatformVersion=$env:WDK_VERSION"
            Write-Host "::notice::DMF build using WindowsTargetPlatformVersion=$env:WDK_VERSION"
          } else {
            Write-Host "::notice::WDK_VERSION empty; letting the WDK pick the platform version itself"
          }
          $log = & msbuild @args 2>&1 | ForEach-Object { "$_" }
          $code = $LASTEXITCODE
          $log | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            $log | Where-Object { $_ -match 'error|MSB\d{4}' } | Select-Object -Last 10 |
              ForEach-Object { Write-Host "::error::DMF: $_" }
            Write-Host "::error::msbuild /t:DmfK exited $code"
            exit 1
          }
          $lib = "$env:RUNNER_TEMP\DMF\Release\${{ steps.plat.outputs.dmf_platform }}\lib\DmfK\DmfK.lib"
          if (-not (Test-Path $lib)) {
            Write-Host "::error::DmfK.lib not produced at $lib"
            exit 1
          }
          Write-Host "built: $lib"
          exit 0
        shell: pwsh

      - name: Build driver
        # Build the solution, never sys/PuppetPadBus.vcxproj directly: the
        # project resolves includes through $(SolutionDir) and fails with a
        # misleading "cannot open include file 'ViGEm/Common.h'" standalone.
        env:
          DmfRootPath: ${{ runner.temp }}\DMF
        run: |
          $ErrorActionPreference = 'Continue'
          # Same rule as the DMF step: an empty global WindowsTargetPlatformVersion
          # is worse than not passing it at all.
          $args = @("PuppetPadBus.sln",
                    "/p:Configuration=Release",
                    "/p:Platform=${{ matrix.platform }}",
                    "/m", "/v:minimal", "/nologo")
          if (-not [string]::IsNullOrWhiteSpace($env:WDK_VERSION)) {
            $args += "/p:WindowsTargetPlatformVersion=$env:WDK_VERSION"
          }
          $log = & msbuild @args 2>&1 | ForEach-Object { "$_" }
          $code = $LASTEXITCODE
          $log | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            $log | Where-Object { $_ -match 'error|MSB\d{4}' } | Select-Object -Last 10 |
              ForEach-Object { Write-Host "::error::driver: $_" }
            Write-Host "::error::msbuild PuppetPadBus.sln exited $code"
            exit 1
          }
          exit 0
        shell: pwsh

      - name: Verify driver was produced
        run: |
          $arch = "${{ matrix.platform }}".ToLower()
          $sys = "bin\$arch\PuppetPadBus.sys"
          if (-not (Test-Path $sys)) { throw "expected $sys, not found" }
          Write-Host "built: $sys"
          # Builds are intentionally unsigned (SignMode=Off). See docs/installing.md.
          (Get-AuthenticodeSignature $sys).Status
        shell: pwsh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PuppetPadBus-${{ matrix.platform }}
          path: |
            bin/**/PuppetPadBus.sys
            bin/**/PuppetPadBus.inf
            bin/**/*.cat
            bin/**/PuppetPadBus.pdb
          if-no-files-found: error
